
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#081323">
<title>App Together</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- Monetag SDK -->
<script src="//libtl.com/sdk.js"
data-zone="12181496"
data-sdk="show_12181496"></script>

<style>
*{box-sizing:border-box}
body{
margin:0;
background:#081323;
color:white;
font-family:Arial,sans-serif;
text-align:center;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
}
.container{
width:90%;
max-width:400px;
}
h1{font-size:32px;margin-bottom:12px}
p{color:#b8c5d8}
button{
width:100%;
padding:17px;
margin-top:20px;
border:0;
border-radius:14px;
background:#18b981;
color:white;
font-size:18px;
font-weight:bold;
cursor:pointer;
}
button:disabled{opacity:.6}
.page{display:none}
#page1{display:block}
</style>
</head>

<body>
<div class="container">

<div class="page" id="page1">
<h1>App Together</h1>
<p>أهلاً بيك في تطبيقنا ❤️</p>
<button onclick="showPage('page2')">ابدأ</button>
</div>

<div class="page" id="page2">
<h1>App Together</h1>
<button id="adButton1" onclick="watchAd('adButton1','page3')">
إضغط لمشاهدة الإعلان
</button>
</div>

<div class="page" id="page3">
<h1>App Together</h1>
<button id="adButton2" onclick="watchAd('adButton2',null)">
إضغط لمشاهدة الإعلان
</button>
<button onclick="showPage('page2')">السابق</button>
</div>

</div>

<script>
const tg = window.Telegram?.WebApp;
if(tg){
tg.ready();
tg.expand();
}

function showPage(id){
document.querySelectorAll('.page').forEach(p=>{
p.style.display='none';
});
document.getElementById(id).style.display='block';
}

function watchAd(buttonId,nextPage){
const btn=document.getElementById(buttonId);

if(typeof window.show_12181496 !== 'function'){
alert('الإعلان لم يتم تحميله. حاول مرة أخرى.');
return;
}

btn.disabled=true;

window.show_12181496()
.then(()=>{
alert('شكراً لمشاهدة الإعلان ❤️');
if(nextPage) showPage(nextPage);
})
.catch(()=>{
alert('لم يكتمل عرض الإعلان. حاول مرة أخرى.');
})
.finally(()=>{
btn.disabled=false;
});
}
</script>

</body>
</html>
