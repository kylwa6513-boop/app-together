
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#081323">
<title>App Together</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#081323;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}
header{
  padding:30px 15px;
  background:#102641;
}
.logo{
  color:#42c9ff;
  font-size:28px;
  font-weight:bold;
}
.container{
  max-width:450px;
  margin:auto;
  padding:25px 18px;
}
.page{display:none}
.page.active{display:block}
.card{
  background:#11233b;
  border:1px solid #25415f;
  border-radius:20px;
  padding:30px 18px;
  margin-top:25px;
}
h2{color:#42c9ff}
p{color:#b5c6da;line-height:1.8}
button{
  width:100%;
  padding:17px;
  border:0;
  border-radius:13px;
  background:#159bd3;
  color:white;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
  margin-top:15px;
}
.back{
  background:#203b5d;
}
.ad-area{
  min-height:180px;
  border:2px dashed #41617f;
  border-radius:15px;
  margin-top:25px;
  padding:20px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#91a8c1;
  line-height:1.8;
}
footer{
  color:#71869e;
  font-size:12px;
  padding:25px;
}
</style>
</head>

<body>

<header>
  <div class="logo">APP TOGETHER 🚀</div>
  <p>Welcome To App Together</p>
</header>

<div class="container">

  <!-- الرئيسية -->
  <section class="page active" id="home">
    <div class="card">
      <h2>أهلاً بيك ❤️</h2>
      <p>اضغط ابدأ وانتقل إلى الإعلانات.</p>
      <button onclick="showPage('page2')">ابدأ</button>
    </div>
  </section>

  <!-- الصفحة الثانية -->
  <section class="page" id="page2">
    <div class="card">
      <div class="ad-area" id="ad-area-1">
        مكان الإعلان
      </div>

      <button onclick="showAdMessage()">
        إضغط لمشاهدة الإعلان
      </button>

      <button class="back" onclick="showPage('page3')">
        التالي
      </button>
    </div>
  </section>

  <!-- الصفحة الثالثة -->
  <section class="page" id="page3">
    <div class="card">
      <div class="ad-area" id="ad-area-2">
        مكان الإعلان
      </div>

      <button onclick="showAdMessage()">
        إضغط لمشاهدة الإعلان
      </button>

      <button class="back" onclick="showPage('page2')">
        السابق
      </button>
    </div>
  </section>

</div>

<footer>App Together © 2026</footer>

<script>
if(window.Telegram && window.Telegram.WebApp){
  Telegram.WebApp.ready();
  Telegram.WebApp.expand();
}

function showPage(id){
  document.querySelectorAll('.page').forEach(page=>{
    page.classList.remove('active');
  });

  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function showAdMessage(){
  alert('سيتم تفعيل الإعلان بعد ربط Monetag.');
}
</script>

</body>
</html>
